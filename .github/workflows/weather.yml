name: Daily weather log
 
on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:
 
jobs:
  log:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python weather_log.py
        env:
          "Account_1": ${{ secrets.SHEET_URL }},
          "Account_2": ${{ secrets.SHEET_URL_2 }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}

